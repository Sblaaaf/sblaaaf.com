services:
  # Production-like image: `docker compose up --build`
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Hot-reload dev server: `docker compose --profile dev up dev`
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # keep the container's own node_modules and build cache (not the host's)
      - /app/node_modules
      - /app/.next
    environment:
      # file watching through a bind mount (Docker Desktop on macOS/Windows)
      WATCHPACK_POLLING: "true"
